name: Deploy to Chrome Web Store

on:
  workflow_dispatch: # manual triggering via GitHub Actions

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'

      - name: Bump version based on conventional commits
        run: |
          node -e "
            const { execSync } = require('child_process');
            const fs = require('fs');

            const manifest = JSON.parse(fs.readFileSync('public/manifest.json', 'utf8'));
            const [major, minor, patch] = manifest.version.split('.').map(Number);

            const lastBumpHash = execSync('git log --format=%H -- public/manifest.json').toString().trim().split('\n')[0];
            const range = lastBumpHash ? \`\${lastBumpHash}..HEAD\` : 'HEAD';
            const commits = execSync(\`git log --format=%s \${range}\`).toString();

            const hasFeat = /^feat(\\(.+\\))?:/m.test(commits);
            const newVersion = hasFeat
              ? \`\${major}.\${minor + 1}.0\`
              : \`\${major}.\${minor}.\${patch + 1}\`;

            manifest.version = newVersion;
            fs.writeFileSync('public/manifest.json', JSON.stringify(manifest, null, 2) + '\n');
            console.log('Bump:', hasFeat ? 'minor' : 'patch');
            console.log('Version:', newVersion);
          "

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/manifest.json
          git commit -m "chore: bump version to $(jq -r '.version' public/manifest.json)"
          git push

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build
      
      - name: Create ZIP file
        run: cd build && zip -r ../extension.zip .
      
      - name: Upload to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: extension.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: extension.zip
