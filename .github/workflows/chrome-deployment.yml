name: Deploy to Chrome Web Store

on:
  workflow_dispatch: # manual triggering via GitHub Actions

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "24"

      - name: Bump version based on conventional commits
        run: bash .github/workflows/scripts/bump-version.sh

      - name: Commit version bump, open PR and enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/manifest.json package.json
          if [ -f package-lock.json ]; then
            git add package-lock.json
          fi

          version="$(jq -r '.version' public/manifest.json)"
          branch="bot/bump-version-$version"
          git checkout -b "$branch"
          git commit -m "chore: bump version to $version"
          git push origin "$branch"

          gh pr create \
            --title "chore: bump version to $version" \
            --body "Automated version bump for Chrome Web Store deployment." \
            --base main \
            --head "$branch"

          gh pr merge "$branch" --auto --squash || echo "Auto-merge not enabled; PR left open for manual merge"

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Create ZIP file
        run: cd build && zip -r ../extension.zip .

      - name: Upload to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: extension.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: extension.zip
